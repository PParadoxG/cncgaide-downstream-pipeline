- id: H47
  label_en: H47 — Cavity without undercut
  grade: —
  scope_en: single feature
  statement_en: Avoid undercut geometry in pockets and slots because it requires a dedicated T-slot, disk, or other special
    cutter and a separate operation.
  threshold_value: null
  threshold_note_en: —
  external_dependency_en: null
  validation_status: candidate
  source_reference: null
  recommendation_text: null
  validity_context_note: null
  retired_reason_en: Undercut and accessibility judgements are not something this pipeline produces, so the rule has no operand it can name inside the ontology.
  authority: pipeline
  nxStatus: retired
- id: H48
  label_en: H48 — Limit tool-axis orientations
  grade: advisory
  scope_en: part-level aggregate
  statement_en: Limit the axis-bearing features of a part to at most two distinct feature_axis directions (within 0.5 degree).
  threshold_value: 2
  threshold_note_en: t_axis_variety = 2; tol_axis = 0.5°
  external_dependency_en: null
  validation_status: candidate
  source_reference: null
  recommendation_text: null
  validity_context_note: null
  retired_reason_en: null
  authority: pipeline
  nxStatus: withdrawn
  nxWithdrawnMechanism: featureSetNotTrusted
  nxNote: 'Counting distinct tool axes requires the feature set itself to be trustworthy. NX''s is not, for this purpose:
    CORNER_NOTCH_STRAIGHT alone contributes nine distinct X orientations over 27 instances, so every part fails, and every
    failure comes from the class node 18'' already judged to be right-angle noise between large planes. Excluding it would
    mean we, not NX, decide what counts as a machining feature.'
  applies_to: []
  condition: null
- id: H49
  label_en: H49 — Limit distinct hole diameters
  grade: advisory
  scope_en: part-level aggregate
  statement_en: Limit a part to at most five distinct through- and blind-hole diameters (within 0.05 mm).
  threshold_value: 5
  threshold_note_en: t_diameter_variety = 5; tol_diameter = 0.05 mm
  external_dependency_en: null
  validation_status: candidate
  source_reference: null
  recommendation_text: null
  validity_context_note: null
  retired_reason_en: null
  authority: pipeline
  nxStatus: evaluable
  nxTier: A
  applies_to:
  - STEP*
  condition: distinct(DIAMETER_1 .. DIAMETER_n over STEP* in part, tol_diameter) <= t_diameter_variety
  nxNote: every section needs its own cutter, so the count runs over the whole sequence and not the entry alone. A six-section
    ladder therefore contributes six diameters by itself - which is what it costs
- id: H50
  label_en: H50 — Feature extent within usable tool length
  grade: hard
  scope_en: single feature
  statement_en: Keep blind-hole, slot and pocket depth, and the maximum face extent of a step, within the usable cutting length
    of a standard tool.
  threshold_value: null
  threshold_note_en: —
  external_dependency_en: tool magazine
  validation_status: candidate
  source_reference: null
  recommendation_text: null
  validity_context_note: null
  retired_reason_en: null
  authority: pipeline
  nxStatus: evaluable
  nxTier: A
  applies_to:
  - STEP*
  - SLOT_*
  - POCKET_*
  condition: DEPTH <= tool_magazine(machine).max_usable_length
  nxNote: only the depth half; max_face_extent belongs to the Step domain, which NX does not have
- id: H51
  label_en: H51 — Minimum remaining wall thickness around a feature
  grade: hard
  scope_en: single feature
  statement_en: Keep the remaining wall thickness around a removal feature at or above 1 mm.
  threshold_value: 1.0
  threshold_note_en: t_min_wall = 1.0 mm
  external_dependency_en: null
  validation_status: candidate
  source_reference: null
  recommendation_text: null
  validity_context_note: null
  retired_reason_en: null
  authority: pipeline
  nxStatus: evaluable
  nxTier: E
  applies_to:
  - STEP*
  - SLOT_*
  - POCKET_*
  - HOLE_*
  condition: derived_min_wall_thickness >= t_min_wall
  nxNote: the HOLES family belongs here for the same reason H43 has it - NX's six HOLE_* classes are the
    milled through-cavities, and a wall left beside one is as thin as a wall left beside a pocket. The
    quantity is ours (nxd:derived_min_wall_thickness), so nothing in NX's vocabulary excluded them; node
    19' simply did not carry v5.1's ThroughCut across and node 21' put it back
- id: H52
  label_en: H52 — Standard countersink angle
  grade: advisory
  scope_en: single feature
  statement_en: Use a standard countersink included angle of 60, 90 or 120 degrees (within 1 degree, DIN 335).
  threshold_value: null
  threshold_note_en: T_countersink_angles = {60, 90, 120} (DIN 335); tol_angle = 1.0°
  external_dependency_en: null
  validation_status: candidate
  source_reference: null
  recommendation_text: null
  validity_context_note: null
  retired_reason_en: null
  authority: pipeline
  nxStatus: withdrawn
  nxWithdrawnMechanism: vocabularyTooCoarse
  nxNote: NX has no countersink notion; ANGLE_TOP_CHAMFER carries the deburring chamfer, the countersink and the inter-section
    cone alike. The non-zero readings in the frozen corpus are 45, 63.43, 61.93 and 41.99 degrees - not one of them in {60,
    90, 120} - so the rule would mark every ordinary 45-degree deburring chamfer as not met.
  applies_to: []
  condition: null
- id: H53
  label_en: H53 — Standard V-slot tool angle
  grade: advisory
  scope_en: single feature
  statement_en: Use a standard V-slot included angle of 30, 45, 60, 90 or 120 degrees (within 1 degree).
  threshold_value: null
  threshold_note_en: T_v_tool_angles = {30, 45, 60, 90, 120}; tol_angle = 1.0°
  external_dependency_en: null
  validation_status: candidate
  source_reference: null
  recommendation_text: null
  validity_context_note: null
  retired_reason_en: null
  authority: pipeline
  nxStatus: evaluable
  nxTier: A
  applies_to:
  - SLOT_V_SHAPED
  - SLOT_DOVE_TAIL
  - SLOT_UPSIDE_DOWN_DOVE_TAIL
  condition: 'exists a in T_v_tool_angles : |ANGLE - a| <= tol_angle'
  nxNote: the three classes that declare ANGLE; all three are reachable but unobserved in the frozen corpus. SLOT_90_DEGREE
    declares no ANGLE because its class name fixes it at 90 degrees, which is already a standard form-tool angle
