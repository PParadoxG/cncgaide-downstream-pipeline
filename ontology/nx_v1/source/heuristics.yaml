- id: H43
  label_en: H43 — Minimum through-cut corner radius
  grade: hard
  scope_en: single feature
  statement_en: Keep the minimum concave internal corner radius of a through cut at or above 3 mm.
  threshold_value: 3.0
  threshold_note_en: t_throughcut_corner_radius = 3.0 mm
  external_dependency_en: null
  validation_status: candidate
