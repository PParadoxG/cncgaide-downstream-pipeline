  external_dependency_en: null
  validation_status: candidate
  source_reference: null
  recommendation_text: null
  validity_context_note: null
  retired_reason_en: Grouping into machining areas is not something this pipeline produces, and coplanarity does not stand for identity of machining area, so COPLANAR is not materialised in the ontology and the rule has no carrier it can name.
  authority: pipeline
  nxStatus: retired
- id: H41
  label_en: H41 — Minimum internal corner angle
  grade: hard
  scope_en: single feature
  statement_en: Keep the minimum concave internal corner angle of a pocket or through cut at or above 90 degrees.
  threshold_value: 90
