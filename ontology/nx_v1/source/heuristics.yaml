- id: H45
  label_en: H45 — Tool length-to-diameter capability
  grade: hard
  scope_en: single feature
  statement_en: Keep the hole depth-to-diameter ratio within the maximum L/D reachable by the available tools.
  threshold_value: null
  threshold_note_en: —
  external_dependency_en: tool magazine
