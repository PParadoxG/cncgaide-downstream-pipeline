deleted_numbers:
- id: H24
  v31_condition: end_shape == 'open'
  reason_en: Its carrier end_shape has retired (the implementation is always open, which carries no information)
- id: H25
  v31_condition: width >= 3.0 and depth <= width
  reason_en: The Groove class was deleted
- id: H29
  v31_condition: derived_min_wall_distance >= diameter
  reason_en: The meaning came back as H51 under a new number; its carrier derived_min_wall_distance has been replaced by derived_min_wall_thickness
- id: H31
  v31_condition: depth - threadDepth >= 3.0
  reason_en: The ThreadedHole class was deleted
- id: H32
  v31_condition: diameter(A) == diameter(B) für A part_of_pattern B
  reason_en: The ThreadedHole class was deleted, and it depended on the retired rel_part_of_pattern
- id: H33
  v31_condition: thread_size in tool_magazine(machine).tap_sizes
  reason_en: The ThreadedHole class was deleted
- id: H40
  v31_condition: cornerRadius >= 3.0 für alle konkaven Kontursegmente
  reason_en: The OuterContour class was deleted
- id: H44
  v31_condition: derived_min_wall_distance >= thickness(wall)
  reason_en: The WallBreakthrough class was deleted; the remaining-wall-thickness concern is covered by H51's ThroughCut domain
