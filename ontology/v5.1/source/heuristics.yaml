  grade: advisory
  scope_en: feature pair (chain)
  statement_en: Along a chain of coaxial, directly adjacent holes with a single non-hole entry and consistent machining directions,
    the diameter shall not increase when traversed from the entry.
  expression_page: |-
    chain(C) = a connected component of Holes formed by COAXIAL ∧ DIRECT_ADJACENT
    entry(C) = the members of C that carry LOCATED_ON whose host owner is not a Hole
    |entry(C)| == 1 ∧ ∀ m, m′ ∈ C publishing machining_direction :
      machining_direction(m) · machining_direction(m′) > 0
      → traversing the chain from entry, diameter is non-increasing
  condition: 'chain(C) = connected component of Hole nodes under (COAXIAL and DIRECT_ADJACENT); entry(C) = members of C having
    a LOCATED_ON whose host owner is not a Hole; |entry(C)| == 1 and forall m, m'' in C publishing machining_direction : machining_direction(m)
    . machining_direction(m'') > 0 -> diameter is non-increasing when C is traversed from entry'
  threshold_value: null
  threshold_note_en: —
  external_dependency_en: null
  applies_to:
  - BlindHole
  - Counterbore
  - Countersink
  - StepBore
  - ThroughHole
  uses_relations:
  - COAXIAL
  - DIRECT_ADJACENT
  - LOCATED_ON
  affects_kpi:
  - kpi_machining_time
  validation_status: candidate
  source_reference: null
  recommendation_text: null
  validity_context_note: Counterbore comparison is directly evaluable from final feature geometry. The multi-feature case
    additionally requires a coaxial relation and an externally supplied order from entry toward increasing depth; this ontology
    does not invent an axial-order property.
  v31_condition: diameter monoton fallend über depth für koaxiale Stufen
  v31_applies_to:
  - Counterbore
  - ThroughHole
