- id: H08
  status: rewritten
  label_en: H08 — Available drill diameter
  grade: advisory
  scope_en: single feature
  statement_en: Choose a hole diameter for which a matching drill (within 0.05 mm) exists in the target machine's magazine.
  expression_page: '∃ d ∈ EXT.drill_diameters : |diameter − d| <= 0.05'
  condition: 'exists d in tool_magazine(machine).drill_diameters : |diameter - d| <= 0.05'
  threshold_value: null
  threshold_note_en: tol_diameter = 0.05 mm
  external_dependency_en: tool magazine
  applies_to:
