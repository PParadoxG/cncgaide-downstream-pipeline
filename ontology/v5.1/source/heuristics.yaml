- id: H26
  status: rewritten
  label_en: H26 — Uniform compound-hole operation geometry
  grade: advisory
  scope_en: part-level aggregate (grouped)
  statement_en: 'Within a same-host group of one compound-hole leaf class, use one operation geometry: equal counterbore diameter
    and depth (within 0.05 mm) for counterbores, or equal countersink diameter (within 0.05 mm) and included angle (within
    1 degree) for countersinks.'
  expression_page: |-
    group = (LOCATED_ON host, leaf class), members per group >= 2
    Counterbore group: distinct((counterbore_diameter, counterbore_depth), 0.05) == 1
    Countersink group: distinct((countersink_diameter, derived_countersink_angle), (0.05, 1°)) == 1
  condition: 'group = (LOCATED_ON host owner, leaf class), group size >= 2; Counterbore group: distinct((counterbore_diameter,
    counterbore_depth), 0.05) == 1; Countersink group: distinct((countersink_diameter, derived_countersink_angle), (0.05,
    1 deg)) == 1'
  threshold_value: null
  threshold_note_en: tol_dim = 0.05 mm; tol_angle = 1.0°
  external_dependency_en: null
  applies_to:
  - Counterbore
  - Countersink
  uses_relations:
  - LOCATED_ON
  affects_kpi:
  - kpi_tool_changes
  validation_status: candidate
  source_reference: null
  recommendation_text: null
  validity_context_note: null
  v31_condition: senkungstyp und Maße einheitlich für alle Senkungen eines Patterns
  v31_applies_to:
  - Counterbore
  - Countersink
- id: H27
  status: rewritten
  label_en: H27 — Normal hole entry
  grade: hard
  scope_en: feature pair
  statement_en: Every LOCATED_ON terminal of a hole shall rest on a planar host face whose normal is parallel to the hole
    axis within 1 degree.
  expression_page: |-
    ∀ t ∈ LOCATED_ON(Hole, ·).terminals :
      t.hostSurfaceType == PLANE ∧ ∠(feature_axis, t.hostSurfaceNormal) <= 1°
  condition: 'forall t in LOCATED_ON(Hole, *).terminals : t.hostSurfaceType == PLANE and angle(feature_axis, t.hostSurfaceNormal)
    <= 1 deg'
  threshold_value: null
  threshold_note_en: t_normal_entry = 1.0°
  external_dependency_en: null
  applies_to:
  - BlindHole
  - Counterbore
  - Countersink
  - StepBore
  - ThroughHole
  uses_relations:
  - LOCATED_ON
