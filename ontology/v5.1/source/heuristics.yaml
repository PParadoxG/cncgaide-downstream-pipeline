  - ThroughHole
- id: H13
  status: rewritten
  label_en: H13 — Hole coaxial with its boss
  grade: informational
  scope_en: single feature (conditional)
  statement_en: If a hole is located on a circular boss, at least one hole located on that boss shall be coaxial with it.
  expression_page: '(∃ h ∈ Hole : LOCATED_ON(h, B)) → (∃ h′ : LOCATED_ON(h′, B) ∧ COAXIAL(h′, B))'
  condition: '(exists h in Hole : LOCATED_ON(h, B)) -> (exists h'' : LOCATED_ON(h'', B) and COAXIAL(h'', B))'
  threshold_value: null
  threshold_note_en: —
  external_dependency_en: null
  applies_to:
  - CircularBoss
  uses_relations:
  - LOCATED_ON
  - COAXIAL
  affects_kpi:
  - kpi_workpiece_stiffness
  validation_status: candidate
  source_reference: null
  recommendation_text: null
  validity_context_note: null
  v31_condition: exists(concentric_with) zwischen ThroughHole und Boss
  v31_applies_to:
  - Boss
  - ThroughHole
