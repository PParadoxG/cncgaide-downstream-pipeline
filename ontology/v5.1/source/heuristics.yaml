heuristics:
- id: H01
  status: domain_changed
  label_en: H01 — Hole depth-to-diameter ratio
  grade: advisory
  scope_en: single feature
  statement_en: Keep the depth-to-diameter ratio of a hole at or below 4.
  expression_page: derived_ratio_depth_to_diameter <= 4
  condition: derived_ratio_depth_to_diameter <= 4
  threshold_value: 4
  threshold_note_en: t_hole_ld = 4
  external_dependency_en: null
  applies_to:
  - BlindHole
  - Counterbore
  - Countersink
  - StepBore
  - ThroughHole
  uses_relations: []
  affects_kpi:
  - kpi_rest_material_indicator
  - kpi_machining_time
  - kpi_tool_wear_proxy
  validation_status: candidate
  source_reference: null
  recommendation_text: null
  validity_context_note: null
  v31_condition: derived_ratio_depth_to_diameter <= 4
  v31_applies_to:
  - BlindHole
- id: H02
  status: rewritten
  label_en: H02 — Standard drill-point blind-hole bottom
  grade: informational
  scope_en: single feature
  statement_en: Use a standard 118-degree or 135-degree conical drill-point bottom for a blind hole.
  expression_page: hole_bottom_type ∈ {conical_118, conical_135}
  condition: hole_bottom_type in {conical_118, conical_135}
  threshold_value: null
  threshold_note_en: Controlled set, no numeric threshold
  external_dependency_en: null
  applies_to:
  - BlindHole
  uses_relations: []
  affects_kpi:
  - kpi_machining_time
  validation_status: candidate
  source_reference: null
  recommendation_text: null
  validity_context_note: null
  v31_condition: bottom_shape_type in {'conical_118','conical_135'}
  v31_applies_to:
  - BlindHole
- id: H03
  status: rewritten
  label_en: H03 — Pocket depth-to-width ratio
  grade: advisory
  scope_en: single feature
  statement_en: Keep the depth of a rectangular pocket at or below five times its most restrictive width.
  expression_page: derived_ratio_depth_to_min_width <= 5
  condition: derived_ratio_depth_to_min_width <= 5
  threshold_value: 5
  threshold_note_en: t_pocket_ld = 5
  external_dependency_en: null
  applies_to:
  - RectangularPocket
  uses_relations: []
  affects_kpi:
  - kpi_tool_wear_proxy
  - kpi_rest_material_indicator
  - kpi_collision_indicator
  validation_status: candidate
  source_reference: null
  recommendation_text: null
  validity_context_note: null
  v31_condition: derived_ratio_depth_to_width <= 5
  v31_applies_to:
  - Pocket
- id: H04
  status: retired
  label_en: H04 — Open pocket preference
  grade: —
  scope_en: single feature
  statement_en: Prefer an open pocket whose opening boundary reaches the exterior part boundary so that axial tool entry can
    be avoided where feasible.
  expression_page: —
  condition: null
  threshold_value: null
  threshold_note_en: —
  external_dependency_en: null
  applies_to: []
  uses_relations: []
  affects_kpi:
  - kpi_machining_time
  validation_status: candidate
  source_reference: null
  recommendation_text: null
  validity_context_note: null
  v31_condition: is_open_state in {'open','half_open'}
  v31_applies_to:
  - Pocket
  retired_reason_en: The open pocket is not in the class space this ontology froze. The Pocket family's criterion is a closed principal wall band, so the rule has no object inside the ontology it can decide.
- id: H05
  status: rewritten
  label_en: H05 — Minimum fillet radius
  grade: advisory
  scope_en: single feature
  statement_en: Use a fillet radius of at least 0.5 mm so that a standard edge-rounding tool can be used.
  expression_page: fillet_radius >= 0.5
  condition: fillet_radius >= 0.5
  threshold_value: 0.5
  threshold_note_en: t_fillet_radius = 0.5 mm
