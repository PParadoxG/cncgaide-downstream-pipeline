- id: H12
  status: rewritten
  label_en: H12 — Minimum web between holes
  grade: hard
  scope_en: feature pair
  statement_en: Keep the material web between two same-host parallel holes (axis spacing minus the mean of both diameters)
    at or above 2 mm.
  expression_page: HOLE_SPACING(A,B).axisSpacing − (diameter(A) + diameter(B)) / 2 >= 2.0
  condition: HOLE_SPACING(A,B).axisSpacing - (diameter(A) + diameter(B)) / 2 >= 2.0
  threshold_value: 2.0
  threshold_note_en: t_hole_web = 2.0 mm
  external_dependency_en: null
  applies_to:
  - BlindHole
  - Counterbore
  - Countersink
  - StepBore
  - ThroughHole
  uses_relations:
  - HOLE_SPACING
  affects_kpi:
  - kpi_collision_indicator
  - kpi_workpiece_stiffness
  validation_status: candidate
  source_reference: null
  recommendation_text: null
  validity_context_note: null
  v31_condition: distanceValue >= max(diameter(A), diameter(B))
  v31_applies_to:
