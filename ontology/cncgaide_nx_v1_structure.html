<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CNCgAIde NX-line ontology nx_v1 &middot; feature classes, attributes and relations</title>
<style>
:root{--bg:#fafaf8;--card:#fff;--ink:#22262e;--mut:#6b7280;--line:#e4e2da;
 --acc:#31556e;--acc-soft:#e8eef3;--hold:#8a6d1a;--hold-soft:#faf3df;--th:#f2f1ec}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--card:#1d2025;--ink:#e6e6e3;--mut:#9aa0a8;
 --line:#2f333a;--acc:#7fb0d0;--acc-soft:#243642;--hold:#d9bf6d;--hold-soft:#332d1c;--th:#24272d}}
*{box-sizing:border-box}
body{margin:0;font:14.5px/1.65 "Segoe UI",system-ui,-apple-system,"Noto Sans SC",sans-serif;
 color:var(--ink);background:var(--bg)}
code,.mono{font-family:Consolas,"SF Mono",Menlo,monospace}

.wrap{display:flex;gap:20px;align-items:flex-start;padding:20px}
nav{flex:0 0 288px;position:sticky;top:20px;background:var(--card);border:1px solid var(--line);
 border-radius:10px;padding:14px 12px;max-height:calc(100vh - 40px);overflow:auto}
main{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;
 padding:26px 34px 60px}
@media(max-width:900px){.wrap{flex-direction:column;padding:12px}nav{position:static;flex:1 1 auto;width:100%;max-height:none}main{width:100%;padding:20px}}

nav .fam{margin:12px 0 3px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
nav .fam:first-child{margin-top:0}
nav .row{display:flex;align-items:baseline;gap:7px;padding:4px 8px;border-radius:6px;cursor:pointer}
nav .row:hover{background:var(--acc-soft)}
nav .row.sel{background:var(--acc-soft)}
nav .cname{font-family:Consolas,monospace;font-size:13.5px;color:var(--acc);font-weight:600}
nav .label{font-size:12.5px;color:var(--mut)}

h1{margin:0 0 4px;font-size:24px;font-family:Consolas,monospace;font-weight:600}
.sub{color:var(--mut);font-size:13.5px;margin-bottom:20px}
h2{font-size:11.5px;color:var(--acc);margin:26px 0 8px;text-transform:uppercase;letter-spacing:.08em;
 font-weight:700;border-bottom:1px solid var(--line);padding-bottom:4px}
p{margin:7px 0}
ul,ol{margin:7px 0;padding-left:20px}
li{margin:4px 0}
.def{background:var(--acc-soft);border-left:3px solid var(--acc);padding:11px 15px;
 border-radius:0 8px 8px 0;margin:4px 0;font-size:15px}

.prop{border:1px solid var(--line);border-radius:9px;padding:13px 17px;margin:11px 0;background:var(--bg)}
.phead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.phead code{font-size:14.5px;color:var(--acc);font-weight:700}
.phead .pzh{font-size:13px;color:var(--ink)}
.phead .pvs{margin-left:auto;font-family:Consolas,monospace;font-size:11.5px;color:var(--mut);
 border:1px solid var(--line);border-radius:20px;padding:1px 10px;white-space:nowrap}
.prop p{margin:5px 0}
.prop ul{margin:5px 0;padding-left:19px;font-size:13.7px}
.cond{margin-top:8px;font-size:13px;display:flex;gap:8px;align-items:flex-start;
 border-left:3px solid var(--hold);background:var(--hold-soft);padding:8px 12px;border-radius:0 7px 7px 0}
.cond .tag{flex:0 0 auto;font-size:11.5px;color:var(--hold);border:1px solid var(--hold);
 border-radius:5px;padding:0 7px;line-height:1.7;white-space:nowrap}
.intro{font-size:13.5px;color:var(--mut);border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:4px}

/* ---- tabs ---- */
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
 display:flex;align-items:center;gap:14px;padding:9px 20px;flex-wrap:wrap}
header .hd{font-size:15px;margin:0;font-family:Consolas,monospace;font-weight:600;color:var(--ink)}
header .hdsub{font-size:12.5px;color:var(--mut)}
.tabs{display:flex;gap:8px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);
 padding:6px 14px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
.tabs button:hover{background:var(--acc-soft)}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.view{display:none}
.view.on{display:block}

/* ---- relation matrix ---- */
.relmain{background:var(--card);border:1px solid var(--line);border-radius:10px;
 margin:20px;padding:26px 34px 60px}
@media(max-width:900px){.relmain{margin:12px;padding:20px}}
#rellegend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0 16px;font-size:12.5px}
#rellegend .lg{display:flex;align-items:center;gap:6px}
#rellegend .sw{width:20px;height:5px;border-radius:3px;display:inline-block}
#rellegend code{font-size:12px;font-weight:700}
#clslegend{display:flex;flex-direction:column;gap:3px;margin:0 0 12px;font-size:12px;color:var(--mut)}
#clslegend .lgfam{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}
#clslegend .lgt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;min-width:150px}
#clslegend .lg code{font-size:11.5px;font-weight:700;color:var(--acc)}
#clslegend .lg .label{margin-left:3px;font-size:11.5px}
#matrixwrap{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
#matrix{border-collapse:separate;border-spacing:0;font-size:11px}
#matrix th,#matrix td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);
 padding:2px 4px;text-align:center;min-width:46px;vertical-align:top}
#matrix th{background:var(--th);position:sticky;top:55px;z-index:2;font-weight:600;
 font-family:Consolas,monospace;font-size:10.5px;height:auto;padding:5px 2px}
#matrix th span{white-space:nowrap;display:inline-block;font-family:Consolas,monospace;font-size:11px}
#matrix th.rowh{position:sticky;left:0;z-index:3;text-align:right;height:auto;
 white-space:nowrap;font-size:11px;padding:3px 7px;top:auto}
#matrix tr:first-child th.rowh{z-index:4;top:55px}
#matrix td.lo{background:var(--th);opacity:.45}
#matrix td.empty{background:transparent}
#matrix td .m{display:block;border-radius:4px;padding:0 3px;margin:1px 0;cursor:default;
 font-family:Consolas,monospace;font-size:10px;line-height:1.5;letter-spacing:.02em}

/* ---- relation entries ---- */
.relcard{border:1px solid var(--line);border-radius:10px;padding:16px 20px 18px;margin:14px 0;
 background:var(--bg)}
.relcard.ret{opacity:.9}
.relhead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:9px;
 border-bottom:1px solid var(--line);padding-bottom:8px}
.relhead .dot{width:10px;height:10px;border-radius:3px;display:inline-block;align-self:center}
.relhead .rid{font-size:15px;font-weight:700;color:var(--acc);font-family:Consolas,monospace}
.relhead .rzh{font-size:13.5px}
.relhead .rtag{font-size:11.5px;color:var(--mut);border:1px solid var(--line);border-radius:20px;
 padding:1px 10px;white-space:nowrap}
.relhead .rcount{margin-left:auto;font-family:Consolas,monospace;font-size:11.5px;color:var(--mut)}
.relcard h3{font-size:11.5px;color:var(--acc);margin:15px 0 6px;text-transform:uppercase;
 letter-spacing:.07em;font-weight:700}
.relcard ol,.relcard ul{margin:6px 0;padding-left:20px;font-size:13.7px}
.relcard ul.excl li{color:var(--ink)}
.relcard ul.excl{list-style:none;padding-left:2px}
.relcard ul.excl li:before{content:"✕";color:var(--hold);font-weight:700;margin-right:7px}
table.obs{border-collapse:collapse;font-size:13px;margin:6px 0;width:100%}
table.obs th,table.obs td{border:1px solid var(--line);padding:4px 9px;text-align:left}
table.obs th{background:var(--th);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
 color:var(--mut);font-weight:600}
table.obs td.num{text-align:right;font-family:Consolas,monospace;width:72px}
.mut{color:var(--mut);font-size:13px}
.notline{font-size:13.3px;margin-top:8px;border-left:3px solid var(--hold);
 background:var(--hold-soft);padding:7px 12px;border-radius:0 7px 7px 0}
table.obs.rel td:first-child{white-space:nowrap;vertical-align:top}
table.obs.rel td{vertical-align:top}
table.obs.rel .dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px}
.relcard{padding:12px 16px 14px;margin:10px 0}
.relcard .relhead{margin-bottom:4px;padding-bottom:6px}
.relcard ul{margin:6px 0;padding-left:20px;font-size:13.5px}

.relmain h2{font-size:11.5px;color:var(--acc);margin:26px 0 8px;text-transform:uppercase;
 letter-spacing:.08em;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:4px}

/* ---- heuristic rules ---- */
.hmain{background:var(--card);border:1px solid var(--line);border-radius:10px;
 margin:20px;padding:26px 34px 60px}
@media(max-width:900px){.hmain{margin:12px;padding:20px}}

.hcard{border:1px solid var(--line);border-radius:9px;padding:12px 16px;margin:10px 0;background:var(--bg)}
.hhead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.hid{font-size:14.5px;color:var(--acc);font-weight:700}
.hzh{font-size:13px;color:var(--ink)}
.hscope{margin-left:auto;font-family:Consolas,monospace;font-size:11.5px;color:var(--mut);
 border:1px solid var(--line);border-radius:20px;padding:1px 10px;white-space:nowrap}
.hstmt{margin:4px 0 7px;font-size:14px}
.hexpr{margin:0;padding:8px 12px;background:var(--th);border-radius:7px;
 font-family:Consolas,"SF Mono",Menlo,monospace;font-size:12.5px;line-height:1.6;
 white-space:pre-wrap;overflow-x:auto;color:var(--ink)}
.hth{margin-top:7px;font-size:12.5px;color:var(--mut);font-family:Consolas,monospace}

.htabwrap{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.htab{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.htab th,.htab td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);
 padding:7px 10px;text-align:left;vertical-align:top}
.htab th{background:var(--th);position:sticky;top:55px;z-index:2;font-weight:600;font-size:12px;white-space:nowrap}
.htab td.small{font-size:12px;color:var(--mut)}
.htab td.mono{font-family:Consolas,"SF Mono",Menlo,monospace;font-size:11.5px;line-height:1.55;min-width:260px}
.htab tr.hret td{opacity:.62}
.htab .rtag{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:5px;
 padding:0 6px;display:inline-block;margin-top:4px}
.htab .rwhy{font-size:12px;color:var(--mut);margin-top:4px}
.htab code{font-size:12px;color:var(--acc)}


/* the colour block for a relation inside a matrix cell.  v5.1 uses a chip carrying the
   abbreviation; here the family names are already in the header, so the cell needs only a
   block that says which relation it is. */
.cellchip{width:11px;height:11px;border-radius:3px;display:inline-block;margin:1px}
#matrix td.lo{background:var(--th)}
.relhead .rzh{font-size:13px;color:var(--mut)}

/* the tree on the left is wider here.  v5.1's 288px fits its own short labels but not NX's
   UPPER_SNAKE names: the widest row, HOLE_ROUND_INTERRUPTED_STRAIGHT, needs 286px at the
   fourth indent level, so almost every row lost its tail.  340px keeps all 84 class names
   readable in full.  It is written here rather than by editing the block above, because
   those 156 lines are a verbatim copy of v5.1's. */
nav{flex-basis:340px}
</style>
</head>

<main class="hmain" id="hmain"></main>
</div>

/* ═══════════════════════════════════════════════════════════════════
   Rendering code, written by hand.  The data block above is generated from the YAML.
   The page branches on no class name, no attribute name and no H number.
   ═══════════════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const BY = {};
C.forEach(c => BY[c[0]] = c);
const KIDS = {};
C.forEach(c => { if (c[1]) (KIDS[c[1]] = KIDS[c[1]] || []).push(c[0]); });
const ROOT = C.find(c => c[1] === null)[0];

function showTab(k) {
  ['cls', 'rel', 'heu'].forEach(x => {
    $('#tb-' + x).classList.toggle('on', x === k);
    $('#v-' + x).classList.toggle('on', x === k);
  });
  window.scrollTo(0, 0);
}

/* inheritance is expanded here in the page: an attribute name appears once, in A */
function effective(name) {
  const seen = {}, out = [];
  for (let cur = name; cur; cur = BY[cur][1])
    BY[cur][4].forEach(i => { if (!(i in seen)) { seen[i] = cur; out.push([i, cur]); } });
  return out.sort((a, b) => A[a[0]][0] < A[b[0]][0] ? -1 : 1);
}
function chain(name) { const o = []; for (let c = name; c; c = BY[c][1]) o.push(c); return o.reverse(); }

/* ═══════════════════════ 1 - FEATURE CLASSES AND ATTRIBUTES ═══════════════════════ */

$('#list').innerHTML = (function tree(name, depth) {
  const c = BY[name];
  let s = `<div class="row" data-c="${esc(name)}" style="padding-left:${8 + depth * 12}px">`
    + `<span class="cname"${c[2] ? ' style="font-style:italic;font-weight:500"' : ''}>${esc(name)}</span></div>`;
  /* the tree does not print niceName: it is longer than the class name, crowds the class
     name out of view, and already appears on the first line of the detail pane on the
     right.  v5.1 prints a short label there instead, which is short enough not to crowd. */
  (KIDS[name] || []).slice().sort().forEach(k => s += tree(k, depth + 1));
  return s;
})(ROOT, 0);

function attrTable(rows) {
  if (!rows.length) return '<p class="mut">none</p>';
  return '<table class="obs"><tr><th>Attribute</th><th>DataType</th><th>Unit</th><th>SubType</th>'
    + '<th>Source</th><th>Inherited from</th></tr>'
    + rows.map(([i, from]) => {
      const a = A[i];
      return `<tr><td><code>${esc(a[0])}</code></td><td>${esc(a[1] || '—')}</td>`
        + `<td>${esc(a[2] || '—')}</td><td>${esc(a[3] || '—')}</td><td>${esc(a[4])}</td>`
        + `<td><code>${esc(from)}</code></td></tr>`;
    }).join('') + '</table>';
}

function hFor(id) { return H.filter(h => (h.classes || []).indexOf(id) >= 0); }

function hCards(list, empty) {
  if (!list.length) return `<p class="mut">${empty}</p>`;
  return list.map(h => `<div class="hcard">
    <div class="hhead"><span class="hid">${esc(h.id)}</span><span class="hzh">${esc(h.label)}</span>
      <span class="hscope">${esc(h.scope)}</span></div>
    <p class="hstmt">${esc(h.stmt)}</p>
    <pre class="hexpr">${esc(h.cond)}</pre>
    ${h.th && h.th !== '—' ? `<div class="hth">${esc(h.th)}</div>` : ''}
    ${h.ext ? `<div class="hth">external input: ${esc(h.ext)}</div>` : ''}</div>`).join('');
}

function show(id) {
  $$('#list .row').forEach(r => r.classList.toggle('sel', r.dataset.c === id));
  const c = BY[id], eff = effective(id), own = eff.filter(e => e[1] === id);
  const inherited = eff.filter(e => e[1] !== id);
  $('#panel').innerHTML = `
   <h1>${esc(id)}</h1>
   <div class="sub">${c[3] ? esc(c[3]) + ' · ' : ''}${c[1] ? 'parent <code>' + esc(c[1]) + '</code> &middot; ' : ''}${eff.length} attributes${c[2] ? ' · abstract' : ''}</div>
   <h2>Inheritance chain</h2>
   <p class="mono">${chain(id).map(n => `<code>${esc(n)}</code>`).join(' › ')}</p>
   <h2>Own fields ${own.length}</h2>
   ${attrTable(own)}
   <h2>Inherited fields ${inherited.length}</h2>
   ${attrTable(inherited)}
   <h2>Heuristic rules that apply</h2>
   <p class="intro">The rules below are evaluated over instances of this class. Attribute names in a condition come from NX's own attribute vocabulary.</p>
   ${hCards(hFor(id), 'No heuristic rule applies to this class at present.')}`;
  window.scrollTo(0, 0);
}
$$('#list .row').forEach(r => r.onclick = () => show(r.dataset.c));
show(ROOT);

/* ═══════════════════════ 2 - RELATIONS ═══════════════════════ */
/* the layout follows v5.1's: relation legend, class legend, allowed-pair matrix, then one
   section per relation.  The axes of the matrix are NX's own families (`STEP` / `HOLES`
   / ...) rather than the 84 leaf classes -- 84x84 spread out is unreadable, and a family
   name is just as much an NX class. */

const FAMS = R.families.map(f => f[0]);
const relChip = r => `<span class="cellchip" title="${esc(r.id)} · ${esc(r.label)}" `
  + `style="background:${r.col}"></span>`;

document.getElementById('rellegend').innerHTML = R.types.map(r =>
  `<span class="lg"><span class="sw" style="background:${r.col}"></span>`
  + `<code>${esc(r.ab)}</code> ${esc(r.id)} <span class="mut">${esc(r.label)}</span></span>`).join('');

document.getElementById('clslegend').innerHTML = R.families.map(f =>
  `<div class="lgfam"><span class="lgt">${esc(f[0])}</span>`
  + f[1].map(c => `<span class="lg"><code>${esc(c)}</code>`
      + `<span class="zh">${esc((BY[c] || [])[3] || '')}</span></span>`).join('')
  + '</div>').join('');

(function buildMatrix() {
  let h = '<table id="matrix"><tr><th class="rowh"></th>'
    + FAMS.map(f => `<th title="${esc(f)}"><span>${esc(f)}</span></th>`).join('') + '</tr>';
  FAMS.forEach((a, i) => {
    h += `<tr><th class="rowh" title="${esc(a)}">${esc(a)}</th>`;
    FAMS.forEach((b, j) => {
      if (j < i) { h += '<td class="lo"></td>'; return; }
      h += '<td>' + R.types.filter(r => r.pairs.indexOf(a + '|' + b) >= 0).map(relChip).join('') + '</td>';
    });
    h += '</tr>';
  });
  document.getElementById('matrixwrap').innerHTML = h + '</table>';
})();

function hForRel(id) { return H.filter(h => (h.rel || []).indexOf(id) >= 0); }

document.getElementById('reldetail').innerHTML =
  `<h2 style="margin-top:26px">${R.types.length} relations</h2>`
  + '<p class="intro">NX publishes no relation between features. Every relation below is obtained by '
  + 'the pipeline from attributes NX does publish, from the PartModel topology, or from a kernel '
  + 'measurement. The names match the open-source line because the topological notion matches; '
  + '<b>no equivalence between the two sides is asserted</b>.</p>'
  + '<table class="obs rel"><tr><th>Relation</th><th>Definition</th><th>Direction</th>'
  + '<th>Allowed class pairs</th><th>Relation properties</th></tr>'
  + R.types.map(r => `<tr><td><span class="dot" style="background:${r.col}"></span>`
      + `<code>${esc(r.id)}</code><div class="mut">${esc(r.label)}</div></td>`
      + `<td>${r.def}</td><td>${esc(r.dir)}</td><td>${r.gov}</td>`
      + `<td>${esc(r.prop)}</td></tr>`).join('')
  + '</table>'
  + '<h2 style="margin-top:26px">When it holds</h2>'
  + R.types.map(r => `<div class="relcard"><div class="relhead">`
      + `<span class="dot" style="background:${r.col}"></span>`
      + `<code class="rid">${esc(r.id)}</code><span class="rzh">${esc(r.label)}</span></div>`
      + '<ul>' + r.when.map(x => `<li>${x}</li>`).join('') + '</ul></div>').join('')
  + '<h2 style="margin-top:26px">Quantities the relations carry</h2>'
  + '<table class="obs"><tr><th>Quantity</th><th>On which relation</th><th>Range</th><th>Unit</th>'
  + '<th>Definition</th></tr>'
  + R.props.map(p => `<tr><td><code>${esc(p.name)}</code><div class="mut">${esc(p.label)}</div></td>`
      + `<td><code>${esc(p.on)}</code></td><td>${esc(p.range)}</td>`
      + `<td>${esc(p.unit || '—')}</td><td>${esc(p.def)}</td></tr>`).join('')
  + '</table>'
  + `<h2 style="margin-top:26px">${esc(R.terminal.class)} <span class="mut">${esc(R.terminal.label)}</span></h2>`
  + `<p>${esc(R.terminal.def)}</p>`
  + '<table class="obs"><tr><th>Field</th><th>Range</th><th>Definition</th></tr>'
  + R.terminal.fields.map(f => `<tr><td><code>${esc(f.name)}</code>`
      + `<div class="mut">${esc(f.label)}</div></td><td>${esc(f.range)}</td>`
      + `<td>${esc(f.def)}</td></tr>`).join('') + '</table>'
  + '<h2 style="margin-top:26px">Derived attributes, nxd:</h2>'
  + '<p class="intro">Quantities the pipeline computes and NX does not publish live in a separate '
  + 'namespace, so that "NX said it" and "we computed it" come apart at the level of the IRI.</p>'
  + '<table class="obs"><tr><th>Name</th><th>Range</th><th>Definition</th></tr>'
  + R.derived.map(d => `<tr><td><code>nxd:${esc(d.name)}</code>`
      + `<div class="mut">${esc(d.label)}</div></td><td>${esc(d.range)}</td>`
      + `<td>${esc(d.def)}</td></tr>`).join('') + '</table>'
  + '<h2 style="margin-top:34px">Heuristic rules that reference each relation</h2>'
  + '<p class="intro">The conditions of the rules below reference the existence of the relation or one of its properties.</p>'
  + R.types.map(r => `<h2 style="margin-top:22px">`
      + `<span class="dot" style="background:${r.col}"></span> ${esc(r.id)}</h2>`
      + hCards(hForRel(r.id), 'No heuristic rule references this relation at present.')).join('');

/* ═══════════════════════ 3 - HEURISTIC RULES ═══════════════════════ */

$('#hmain').innerHTML =
  '<h1>Heuristic rules</h1>'
  + `<div class="sub">${H.length} rules; domains and conditions are written in NX's own class and attribute names.</div>`
  + '<div class="htabwrap"><table class="htab"><tr><th>H</th><th>Name</th><th>Grade</th>'
  + '<th>Scope</th><th>Domain</th><th>Condition</th></tr>'
  + H.map(h => `<tr><td><code>${esc(h.id)}</code></td><td>${esc(h.label)}</td>`
      + `<td class="small">${esc(h.grade)}</td><td class="small">${esc(h.scope)}</td>`
      + `<td class="mono">${h.on.map(o => esc(o)).join('<br>')}</td>`
      + `<td class="mono">${esc(h.cond)}</td></tr>`).join('')
  + '</table></div>'
  + '<h2 style="margin-top:26px">Rule by rule</h2>'
  + hCards(H, '');
</script>
</body>
