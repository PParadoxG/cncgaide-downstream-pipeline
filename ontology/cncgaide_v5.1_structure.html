<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CNCgAIde ontology v5 &middot; feature classes, attributes and relations</title>
<style>
:root{--bg:#fafaf8;--card:#fff;--ink:#22262e;--mut:#6b7280;--line:#e4e2da;
 --acc:#31556e;--acc-soft:#e8eef3;--hold:#8a6d1a;--hold-soft:#faf3df;--th:#f2f1ec}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--card:#1d2025;--ink:#e6e6e3;--mut:#9aa0a8;
 --line:#2f333a;--acc:#7fb0d0;--acc-soft:#243642;--hold:#d9bf6d;--hold-soft:#332d1c;--th:#24272d}}
*{box-sizing:border-box}
body{margin:0;font:14.5px/1.65 "Segoe UI",system-ui,-apple-system,"Noto Sans SC",sans-serif;
 color:var(--ink);background:var(--bg)}
code,.mono{font-family:Consolas,"SF Mono",Menlo,monospace}

.wrap{display:flex;gap:20px;align-items:flex-start;padding:20px}
nav{flex:0 0 288px;position:sticky;top:20px;background:var(--card);border:1px solid var(--line);
 border-radius:10px;padding:14px 12px;max-height:calc(100vh - 40px);overflow:auto}
main{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;
 padding:26px 34px 60px}
@media(max-width:900px){.wrap{flex-direction:column;padding:12px}nav{position:static;flex:1 1 auto;width:100%;max-height:none}main{width:100%;padding:20px}}

nav .fam{margin:12px 0 3px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
nav .fam:first-child{margin-top:0}
nav .row{display:flex;align-items:baseline;gap:7px;padding:4px 8px;border-radius:6px;cursor:pointer}
nav .row:hover{background:var(--acc-soft)}
nav .row.sel{background:var(--acc-soft)}
nav .cname{font-family:Consolas,monospace;font-size:13.5px;color:var(--acc);font-weight:600}
nav .label{font-size:12.5px;color:var(--mut)}

h1{margin:0 0 4px;font-size:24px;font-family:Consolas,monospace;font-weight:600}
.sub{color:var(--mut);font-size:13.5px;margin-bottom:20px}
h2{font-size:11.5px;color:var(--acc);margin:26px 0 8px;text-transform:uppercase;letter-spacing:.08em;
 font-weight:700;border-bottom:1px solid var(--line);padding-bottom:4px}
p{margin:7px 0}
ul,ol{margin:7px 0;padding-left:20px}
li{margin:4px 0}
.def{background:var(--acc-soft);border-left:3px solid var(--acc);padding:11px 15px;
 border-radius:0 8px 8px 0;margin:4px 0;font-size:15px}

.prop{border:1px solid var(--line);border-radius:9px;padding:13px 17px;margin:11px 0;background:var(--bg)}
.phead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.phead code{font-size:14.5px;color:var(--acc);font-weight:700}
.phead .pzh{font-size:13px;color:var(--ink)}
.phead .pvs{margin-left:auto;font-family:Consolas,monospace;font-size:11.5px;color:var(--mut);
 border:1px solid var(--line);border-radius:20px;padding:1px 10px;white-space:nowrap}
.prop p{margin:5px 0}
.prop ul{margin:5px 0;padding-left:19px;font-size:13.7px}
.cond{margin-top:8px;font-size:13px;display:flex;gap:8px;align-items:flex-start;
 border-left:3px solid var(--hold);background:var(--hold-soft);padding:8px 12px;border-radius:0 7px 7px 0}
.cond .tag{flex:0 0 auto;font-size:11.5px;color:var(--hold);border:1px solid var(--hold);
 border-radius:5px;padding:0 7px;line-height:1.7;white-space:nowrap}
.intro{font-size:13.5px;color:var(--mut);border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:4px}

/* ---- tabs ---- */
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
 display:flex;align-items:center;gap:14px;padding:9px 20px;flex-wrap:wrap}
header .hd{font-size:15px;margin:0;font-family:Consolas,monospace;font-weight:600;color:var(--ink)}
header .hdsub{font-size:12.5px;color:var(--mut)}
.tabs{display:flex;gap:8px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);
 padding:6px 14px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
.tabs button:hover{background:var(--acc-soft)}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.view{display:none}
.view.on{display:block}

/* ---- relation matrix ---- */
.relmain{background:var(--card);border:1px solid var(--line);border-radius:10px;
 margin:20px;padding:26px 34px 60px}
@media(max-width:900px){.relmain{margin:12px;padding:20px}}
#rellegend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0 16px;font-size:12.5px}
#rellegend .lg{display:flex;align-items:center;gap:6px}
#rellegend .sw{width:20px;height:5px;border-radius:3px;display:inline-block}
#rellegend code{font-size:12px;font-weight:700}
#clslegend{display:flex;flex-direction:column;gap:3px;margin:0 0 12px;font-size:12px;color:var(--mut)}
#clslegend .lgfam{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}
#clslegend .lgt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;min-width:150px}
#clslegend .lg code{font-size:11.5px;font-weight:700;color:var(--acc)}
#clslegend .lg .label{margin-left:3px;font-size:11.5px}
#matrixwrap{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
#matrix{border-collapse:separate;border-spacing:0;font-size:11px}
#matrix th,#matrix td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);
 padding:2px 4px;text-align:center;min-width:46px;vertical-align:top}
#matrix th{background:var(--th);position:sticky;top:55px;z-index:2;font-weight:600;
 font-family:Consolas,monospace;font-size:10.5px;height:auto;padding:5px 2px}
#matrix th span{white-space:nowrap;display:inline-block;font-family:Consolas,monospace;font-size:11px}
#matrix th.rowh{position:sticky;left:0;z-index:3;text-align:right;height:auto;
 white-space:nowrap;font-size:11px;padding:3px 7px;top:auto}
#matrix tr:first-child th.rowh{z-index:4;top:55px}
#matrix td.lo{background:var(--th);opacity:.45}
#matrix td.empty{background:transparent}
#matrix td .m{display:block;border-radius:4px;padding:0 3px;margin:1px 0;cursor:default;
 font-family:Consolas,monospace;font-size:10px;line-height:1.5;letter-spacing:.02em}

/* ---- relation entries ---- */
.relcard{border:1px solid var(--line);border-radius:10px;padding:16px 20px 18px;margin:14px 0;
 background:var(--bg)}
.relcard.ret{opacity:.9}
.relhead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:9px;
 border-bottom:1px solid var(--line);padding-bottom:8px}
.relhead .dot{width:10px;height:10px;border-radius:3px;display:inline-block;align-self:center}
.relhead .rid{font-size:15px;font-weight:700;color:var(--acc);font-family:Consolas,monospace}
.relhead .rzh{font-size:13.5px}
.relhead .rtag{font-size:11.5px;color:var(--mut);border:1px solid var(--line);border-radius:20px;
 padding:1px 10px;white-space:nowrap}
.relhead .rcount{margin-left:auto;font-family:Consolas,monospace;font-size:11.5px;color:var(--mut)}
.relcard h3{font-size:11.5px;color:var(--acc);margin:15px 0 6px;text-transform:uppercase;
 letter-spacing:.07em;font-weight:700}
.relcard ol,.relcard ul{margin:6px 0;padding-left:20px;font-size:13.7px}
.relcard ul.excl li{color:var(--ink)}
.relcard ul.excl{list-style:none;padding-left:2px}
.relcard ul.excl li:before{content:"✕";color:var(--hold);font-weight:700;margin-right:7px}
table.obs{border-collapse:collapse;font-size:13px;margin:6px 0;width:100%}
table.obs th,table.obs td{border:1px solid var(--line);padding:4px 9px;text-align:left}
table.obs th{background:var(--th);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
 color:var(--mut);font-weight:600}
table.obs td.num{text-align:right;font-family:Consolas,monospace;width:72px}
.mut{color:var(--mut);font-size:13px}
.notline{font-size:13.3px;margin-top:8px;border-left:3px solid var(--hold);
 background:var(--hold-soft);padding:7px 12px;border-radius:0 7px 7px 0}
table.obs.rel td:first-child{white-space:nowrap;vertical-align:top}
table.obs.rel td{vertical-align:top}
table.obs.rel .dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px}
.relcard{padding:12px 16px 14px;margin:10px 0}
.relcard .relhead{margin-bottom:4px;padding-bottom:6px}
.relcard ul{margin:6px 0;padding-left:20px;font-size:13.5px}

.relmain h2{font-size:11.5px;color:var(--acc);margin:26px 0 8px;text-transform:uppercase;
 letter-spacing:.08em;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:4px}

/* ---- heuristic rules ---- */
.hmain{background:var(--card);border:1px solid var(--line);border-radius:10px;
 margin:20px;padding:26px 34px 60px}
@media(max-width:900px){.hmain{margin:12px;padding:20px}}

.hcard{border:1px solid var(--line);border-radius:9px;padding:12px 16px;margin:10px 0;background:var(--bg)}
.hhead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.hid{font-size:14.5px;color:var(--acc);font-weight:700}
.hzh{font-size:13px;color:var(--ink)}
.hscope{margin-left:auto;font-family:Consolas,monospace;font-size:11.5px;color:var(--mut);
 border:1px solid var(--line);border-radius:20px;padding:1px 10px;white-space:nowrap}
.hstmt{margin:4px 0 7px;font-size:14px}
.hexpr{margin:0;padding:8px 12px;background:var(--th);border-radius:7px;
 font-family:Consolas,"SF Mono",Menlo,monospace;font-size:12.5px;line-height:1.6;
 white-space:pre-wrap;overflow-x:auto;color:var(--ink)}
.hth{margin-top:7px;font-size:12.5px;color:var(--mut);font-family:Consolas,monospace}

.htabwrap{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.htab{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.htab th,.htab td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);
 padding:7px 10px;text-align:left;vertical-align:top}
.htab th{background:var(--th);position:sticky;top:55px;z-index:2;font-weight:600;font-size:12px;white-space:nowrap}
.htab td.small{font-size:12px;color:var(--mut)}
.htab td.mono{font-family:Consolas,"SF Mono",Menlo,monospace;font-size:11.5px;line-height:1.55;min-width:260px}
.htab tr.hret td{opacity:.62}
.htab .rtag{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:5px;
 padding:0 6px;display:inline-block;margin-top:4px}
.htab .rwhy{font-size:12px;color:var(--mut);margin-top:4px}
.htab code{font-size:12px;color:var(--acc)}

</style>
</head>
<body>
<header>
  <div class="tabs">
    <button id="tb-cls" class="on" onclick="showTab('cls')">1 &middot; Feature classes and attributes</button>
    <button id="tb-rel" onclick="showTab('rel')">2 &middot; Relation matrix</button>
    <button id="tb-heu" onclick="showTab('heu')">3 &middot; Heuristic rules</button>
  </div>
</header>

<div class="view on" id="v-cls">
<div class="wrap">
  <nav id="list"></nav>
  <main id="panel"></main>
</div>
</div>

<div class="view" id="v-heu">
<main class="hmain" id="hmain"></main>
</div>

<div class="view" id="v-rel">
<main class="relmain">
  <div id="rellegend"></div>
  <div id="clslegend"></div>

  <div id="matrixwrap"></div>

  <div id="reldetail"></div>
</main>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   CNCgAIde ontology v5.1 - feature classes and attribute definitions
   This document says only what makes something an instance of a feature class,
   and what each attribute measures.
   ═══════════════════════════════════════════════════════════════════ */

const PM={
 cadFaceIds:["CAD face ids","xsd:string, comma-separated identifiers of the source STEP faces"],
 pos:["reference point X / Y / Z","xsd:decimal, mm, part coordinate system"],
 feature_axis:["feature axis","unit vector, undirected: normalized and sign-fixed so that the dominant component is positive"],
 machining_direction:["machining direction","unit vector, signed, pointing into the material"],
 surface_normal:["surface normal","unit vector, signed, pointing out of the material"],
 area:["area","xsd:decimal, mm^2, > 0"],
 depth:["depth","xsd:decimal, mm, > 0"],
 diameter:["diameter","xsd:decimal, mm, > 0"],
 height:["height","xsd:decimal, mm, > 0"],
 min_face_extent:["minimum face extent","xsd:decimal, mm, > 0"],
 max_face_extent:["maximum face extent","xsd:decimal, mm, > 0"],
 step_included_angle:["step included angle","xsd:decimal, degrees, > 0 and < 180"],
 base_diameter:["base diameter","xsd:decimal, mm, > 0"],
 top_diameter:["top diameter","xsd:decimal, mm, > 0"],
 base_thickness:["base thickness","xsd:decimal, mm, > 0"],
 top_thickness:["top thickness","xsd:decimal, mm, > 0"],
 min_opening_width:["minimum opening width","xsd:decimal, mm, > 0"],
 min_bottom_width:["minimum bottom width","xsd:decimal, mm, > 0"],
 profile_radius:["profile radius","xsd:decimal, mm, > 0"],
 course_length:["course length","xsd:decimal, mm, > 0"],
 min_corner_radius:["minimum corner radius","xsd:decimal, mm, >= 0 (0 = genuine sharp corner)"],
 min_corner_angle:["minimum corner angle","xsd:decimal, degrees, > 0 and < 180"],
 max_wall_draft_angle:["maximum wall draft angle","xsd:decimal, degrees, >= 0 (0 = genuinely vertical walls)"],
 v_included_angle:["V included angle","xsd:decimal, degrees, > 0 and < 180"],
 hole_bottom_type:["hole bottom type","xsd:string, vocabulary: flat | conical_118 | conical_135 | rounded"],
 pocket_bottom_type:["pocket bottom type","xsd:string, vocabulary: flat | non_flat | mixed"],
 chamfer_width:["chamfer width","xsd:decimal, mm, > 0"],
 min_chamfer_angle:["minimum chamfer angle","xsd:decimal, degrees, > 0 and < 90"],
 fillet_radius:["fillet radius","xsd:decimal, mm, > 0"],
 counterbore_diameter:["counterbore diameter","xsd:decimal, mm, > 0"],
 counterbore_depth:["counterbore depth","xsd:decimal, mm, > 0"],
 countersink_diameter:["countersink diameter","xsd:decimal, mm, > 0"],
 countersink_depth:["countersink depth","xsd:decimal, mm, > 0"],
 derived_countersink_angle:["derived countersink angle","xsd:decimal, degrees, > 0 and < 180"],
 derived_wall_draft_angle:["derived wall draft angle","xsd:decimal, degrees, >= 0"],
 derived_min_wall_thickness:["derived minimum wall thickness","xsd:decimal, mm, >= 0"],
 derived_min_clearance:["derived minimum clearance","xsd:decimal, mm, >= 0"],
 derived_floor_thickness:["derived floor thickness","xsd:decimal, mm, >= 0"],
 derived_ratio_depth_to_diameter:["derived ratio depth / diameter (L/D)","xsd:decimal, dimensionless, > 0"],
 derived_ratio_depth_to_min_width:["derived ratio depth / minimum width","xsd:decimal, dimensionless, > 0"],
 derived_ratio_min_corner_radius_to_depth:["derived ratio minimum corner radius / depth","xsd:decimal, dimensionless, >= 0"],
 derived_ratio_height_to_thickness:["derived ratio height / thickness","xsd:decimal, dimensionless, > 0"]
};

const ORDER=[
 ["Hole",["ThroughHole", "BlindHole", "Counterbore", "Countersink", "StepBore"]],
 ["Recess",["RectangularSlot", "TriangularSlot", "CircularSlot", "GeneralSlot", "RectangularPocket", "GeneralPocket", "ThroughCut"]],
 ["Boss",["CircularBoss", "RectangularBoss", "GeneralBoss"]],
 ["EdgeTreatment",["Chamfer", "Fillet"]],
 ["Surface",["PlanarFace", "FreeformFace"]],
 ["Standalone leaves",["Step"]]
];

/* ═══════════════════════ LEAF CLASSES ═══════════════════════
   each leaf: label / ab (matrix abbreviation) / parent / def (one-line definition) / props
   each prop: [attribute name, definition, notes[], not published when | null]
   ═══════════════════════════════════════════════════ */
const C={

/* ─────────────── Hole ─────────────── */
ThroughHole:{label:"Through hole",ab:"TH",parent:"Hole",
def:"Cylindrical removal volume whose cylindrical wall is bounded at both ends by complete closed loops that open to the outside of the part.",
props:[
 ["cadFaceIds","The feature owns a single active face, the cylindrical wall; recorded here are the source face ids that wall corresponded to before the merge.",[],null],
 ["pos","The <b>axial mid-point</b>, that is the mid-point of the axial span of the cylindrical wall.",[],null],
 ["feature_axis","Axis of the cylindrical face itself, normalised with a positive dominant component.",["Undirected. Coaxial, parallel and perpendicular criteria use this attribute directly, written the same way as on every other class that publishes an axis."],null],
 ["depth","<b>Axial span of the cylindrical wall itself</b> - neither measured from the entry face, nor the distance between the two opening planes.",["Where the two end faces of the hole are not parallel, or the entry is chamfered, the span of the wall and the distance between the two surfaces of the part are not equal."],null],
 ["diameter","Twice the radius of the cylindrical wall.",[],null],
 ["derived_min_wall_thickness","Rays are cast from sample points on the hole wall towards the material side until they first hit a face that <b>does not belong to this feature</b>; the minimum over all sampled rays is taken.",["Samples that hit a face of this feature itself are always discarded.", "It answers how much material is left against breakthrough sideways, which is a different question from the margin in the direction of the bottom."],"The rays hit no other surface."],
 ["derived_ratio_depth_to_diameter","<code>depth / diameter</code>.",[],null]
]
},

BlindHole:{label:"Blind hole",ab:"BH",parent:"Hole",
def:"Cylindrical removal volume that opens to the outside of the part at one end and is closed by material at the other end, forming a bottom.",
props:[
 ["cadFaceIds","Source face ids of every face of the cylindrical wall and of the bottom region.",[],null],
 ["pos","The <b>centre of the floor circle</b>, that is the root centre.",["On a flat bottom it is <b>where the axis meets the bottom face</b>; on a conical bottom it is the <b>cone apex</b>, the deepest point on that axis.", "Nothing is published where the bottom region has some other form, or where several bottom faces give reference points that disagree; no approximation such as a bounding-box centre is substituted."],"The bottom region is neither all planar nor all conical, or several bottom faces give inconsistent reference points."],
 ["feature_axis","Axis of the cylindrical face itself, normalised with a positive dominant component.",[],null],
 ["machining_direction","Along the axis, from the opening towards the floor.",[],null],
 ["depth","<b>Axial span of the cylindrical wall itself.</b>",["<b>The conical bottom is not included.</b> Where the bottom is a standard drill point this value differs from the total depth to the deepest point by roughly 0.3 diameters, a difference that shifts the depth-to-diameter ratio by an order of magnitude."],null],
 ["diameter","Twice the radius of the cylindrical wall.",[],null],
 ["hole_bottom_type","Controlled classification of the geometry of the bottom region.",["<code>flat</code> where every bottom face is planar; <code>rounded</code> where all are spherical or toroidal; the matching standard drill-point value where all are conical and the included angle lies within 118°±1 or 135°±1. Any other combination publishes no classification and is not rounded to the nearest one."],"The bottom geometry falls under none of the controlled values above."],
 ["derived_floor_thickness","Distance between the bottom and the first opposite surface found from the bottom along <code>machining_direction</code>.",[],"No reliable opposite surface was found from the bottom along the feed direction."],
 ["derived_min_wall_thickness","Minimum hit distance of rays cast from the hole wall towards the material side, excluding samples that hit a face of this feature itself.",["Answers a different question from <code>derived_floor_thickness</code>: breakthrough sideways as against breakthrough at the bottom."],"The rays hit no other surface."],
 ["derived_ratio_depth_to_diameter","<code>depth / diameter</code>, the numerator being the axial span of the wall without the conical bottom.",[],null]
]
},

Counterbore:{label:"Counterbore",ab:"CBR",parent:"Hole",
def:"Compound hole consisting of a base cylindrical hole and a coaxial cylindrical counterbore section of larger diameter, the two sections joined by a real internal annular shoulder.",
props:[
 ["cadFaceIds","Source face ids of all three parts - base hole, counterbore section and shoulder - including the faces owned by the reclaimed component nodes.",[],null],
 ["pos","The <b>centre of the base-hole bottom circle</b>, that is where the base-hole axis meets the end of the base hole.",[],null],
 ["feature_axis","Axis of the base hole, normalised with a positive dominant component.",[],null],
 ["machining_direction","Along the axis, from the outer opening into the material.",[],null],
 ["depth","<b>Total axial extent</b> from the outer opening to the end of the base hole, counterbore section included.",["That is the length the base-hole drill has to stand out to enter from the surface of the part."],null],
 ["diameter","Diameter of the <b>base hole</b>. The diameter of the enlarged section is carried separately by <code>counterbore_diameter</code>.",[],null],
 ["counterbore_diameter","Diameter of the enlarged cylindrical counterbore section.",[],null],
 ["counterbore_depth","Axial depth of the enlarged counterbore section from its own entry plane, that is the distance from the outer opening to the shoulder.",["The value has to be strictly smaller than <code>depth</code>, or the candidate does not hold."],null],
 ["derived_min_wall_thickness","Minimum hit distance of rays cast from the walls of the base hole and of the counterbore section towards the material side.",[],"The rays hit no other surface."],
 ["derived_ratio_depth_to_diameter","<code>depth / diameter</code>, the same formula as on the other three Hole leaves.",[],null]
]
},

Countersink:{label:"Countersink",ab:"CSK",parent:"Hole",
def:"Compound hole consisting of a base cylindrical hole and a coaxial conical enlargement.",
props:[
 ["cadFaceIds","Source face ids of the base hole and of the conical section.",[],null],
 ["pos","The <b>centre of the base-hole bottom circle</b>, that is where the base-hole axis meets the end of the base hole.",[],null],
 ["feature_axis","Axis of the base hole, normalised with a positive dominant component.",[],null],
 ["machining_direction","Along the axis, from the outer opening into the material.",[],null],
 ["depth","<b>Total axial extent</b> from the outer opening to the end of the base hole, conical section included.",[],null],
 ["diameter","Diameter of the <b>base hole</b>.",[],null],
 ["countersink_diameter","Major diameter at the entry of the conical countersink, that is twice the larger of the two circular boundary radii of the cone face.",[],null],
 ["countersink_depth","Axial depth of the conical section from the outer opening to the small end, where it meets the base hole.",["A direct boundary measurement: the difference between the axial coordinates of the two circular boundaries of the conical section."],null],
 ["derived_countersink_angle","<b>Included angle</b> of the countersink measured between opposite generatrices, obtained from <code>2 · atan((countersink_diameter − diameter) / (2 · countersink_depth))</code>.",["<b>Not the half angle.</b> It is recovered from the trigonometry rather than asserted a second time as an independently measured attribute."],null],
 ["derived_min_wall_thickness","Minimum hit distance of rays cast from the walls of the base hole and of the conical section towards the material side.",[],"The rays hit no other surface."],
 ["derived_ratio_depth_to_diameter","<code>depth / diameter</code>.",[],null]
]
},

StepBore:{label:"Step bore",ab:"SBR",parent:"Hole",
def:"Non-terminal cylindrical section of a multi-step coaxial hole. Its major end opens either to the outside of the part or into the preceding section of larger diameter; its minor end is closed by an annular shoulder that caps only the annular gap, the centre being continued by the following section of smaller diameter.",
props:[
 ["cadFaceIds","Source face ids of every face of the cylindrical wall and of the annular shoulder at the small end.",[],null],
 ["pos","The <b>centre of the shoulder plane at the small end</b>, that is the root centre of the section.",["The same convention as taking the centre of the bottom circle on a blind hole: the reference point sits at the root of the section, not at its opening."],"The shoulder at the small end is not planar, or several shoulder faces give inconsistent reference points."],

/* ═══════════════════════ RENDERING ═══════════════════════ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

document.getElementById('list').innerHTML=ORDER.map(([fam,kids])=>
 `<div class="fam">${fam}</div>`+kids.map(id=>{
   const c=C[id];
   return `<div class="row" data-c="${id}">
     <span class="cname">${id}</span><span class="zh">${c.label}</span></div>`;
 }).join('')).join('');

function propBlock(p){
  const [id,def,sem,cond]=p;
  const [zh,vs]=PM[id];
  const name=id==='pos'?'posX / posY / posZ':id;
  return `<div class="prop">
   <div class="phead"><code>${name}</code><span class="pzh">${zh}</span>
     <span class="pvs">${vs}</span></div>
   <p>${def}</p>
   ${sem&&sem.length?`<ul>${sem.map(s=>`<li>${s}</li>`).join('')}</ul>`:''}
   ${cond?`<div class="cond"><span class="tag">not published when</span><span>${cond}</span></div>`:''}
  </div>`;
}

function show(id){
  $$('#list .row').forEach(r=>r.classList.toggle('sel',r.dataset.c===id));
  const c=C[id];
  const np=c.props.reduce((a,p)=>a+(p[0]==='pos'?3:1),0);
  $('#panel').innerHTML=`
   <h1>${id}</h1>
   <div class="sub">${c.label} &middot; parent <code>${c.parent}</code> &middot; publishes ${np} attributes</div>
   <h2>Definition</h2><div class="def">${c.def}</div>
   <h2>Published attributes</h2>
   ${c.props.map(propBlock).join('')}

/* ═══════════════════════ HEURISTIC RULES ═══════════════════════
   each H: id / label / grade / scope / stmt / expr / on[] / rel[] / th / ext / note / retired
   grade: hard        = violating it cannot be made, or the process has to change
          advisory    = can be made, but at a significantly higher cost
          informational = departs from the usual; whether it is a problem depends on function
   ═══════════════════════════════════════════════════════════ */

const AXIS_LEAVES = ["ThroughHole", "BlindHole", "Counterbore", "Countersink", "StepBore", "RectangularSlot", "TriangularSlot", "CircularSlot", "GeneralSlot", "RectangularPocket", "GeneralPocket", "ThroughCut", "CircularBoss", "RectangularBoss", "GeneralBoss"];

{id:"H02", label:"H02 — Standard drill-point blind-hole bottom", grade:"informational", scope:"single feature", stmt:"Use a standard 118-degree or 135-degree conical drill-point bottom for a blind hole.", expr:"hole_bottom_type ∈ {conical_118, conical_135}", on:["BlindHole"], rel:[], th:"Controlled set, no numeric threshold"},

{id:"H03", label:"H03 — Pocket depth-to-width ratio", grade:"advisory", scope:"single feature", stmt:"Keep the depth of a rectangular pocket at or below five times its most restrictive width.", expr:"derived_ratio_depth_to_min_width <= 5", on:["RectangularPocket"], rel:[], th:"t_pocket_ld = 5"},

const hFor    = c => H.filter(h => !h.retired && h.on.indexOf(c) >= 0);

/* ═══════════════════════ HEURISTIC RULE RENDERING ═══════════════════════ */

/* the compact block shown under a feature class or a relation entry */
function hBlock(h){
  return '<div class="hcard">'+
    '<div class="hhead"><code class="hid">'+h.id+'</code>'+
      '<span class="hzh">'+h.label+'</span>'+
      '<span class="hscope">'+h.scope+'</span></div>'+
    '<p class="hstmt">'+h.stmt+'</p>'+
    '<pre class="hexpr">'+h.expr+'</pre>'+
    (h.th && h.th!=='—' ? '<div class="hth">threshold &nbsp;'+h.th+'</div>' : '')+
  '</div>';
}

function hSection(list, empty){
  if(!list.length) return '<p class="intro" style="border:0;margin:0">'+empty+'</p>';
  return list.map(hBlock).join('');
}

/* tab 3: the full table, in number order */
function buildHTable(){
  const rows = H.map(h=>{
    const on = h.retired ? '—'
      : (h.on.length>6 ? h.on.length+' leaf classes' : h.on.map(x=>'<code>'+x+'</code>').join(', '));
    const rel = h.retired ? '—' : (h.rel.length ? h.rel.map(x=>'<code>'+x+'</code>').join(', ') : '—');
    return '<tr class="'+(h.retired?'hret':'')+'">'+
      '<td><code class="hid">'+h.id+'</code>'+(h.retired?'<div class="rtag">retired</div>':'')+'</td>'+
      '<td>'+h.label+'</td>'+
      '<td>'+h.stmt+(h.retired?'<div class="rwhy">'+h.retired+'</div>':'')+'</td>'+
      '<td class="mono small">'+(h.retired?'—':h.expr.replace(/\n/g,'<br>'))+'</td>'+
      '<td>'+(h.retired?'—':h.scope)+'</td>'+
      '<td class="small">'+(h.retired?'—':(h.ext||'none'))+'</td>'+
      '<td class="small">'+on+'</td>'+
      '<td class="small">'+rel+'</td>'+
      '<td class="small">'+(h.retired?'—':h.th)+'</td></tr>';
  }).join('');

  const live = H.filter(h=>!h.retired).length;
  document.getElementById('hmain').innerHTML =
    '<h1>Heuristic rules</h1>'+
    '<div class="sub">'+H.length+' rules: '+live+' in force, '+(H.length-live)+' retired &middot; in number order</div>'+
    '<div class="htabwrap"><table class="htab">'+
    '<tr><th>Id</th><th>Name</th><th>Rule</th><th>Condition</th><th>Scope</th>'+
    '<th>External input</th><th>Leaf classes</th><th>Relations used</th><th>Thresholds</th></tr>'+
    rows+'</table></div>';
}


function chip(r) {
  return '<span class="m" style="background:' + r.col + ';color:#fff" title="' +
    r.id + " · " + r.label + '">' + r.ab + "</span>";
}

function buildMatrix() {
  // both axes use the abbreviation (C[id].ab); the full class name is in the legend above the table and in each cell title
  document.getElementById("clslegend").innerHTML = ORDER.map(([fam, kids]) =>
    '<div class="lgfam"><span class="lgt">' + fam + "</span>" +
    kids.map((c) => '<span class="lg"><code>' + C[c].ab + "</code> " + c + '<span class="zh">' + C[c].label + "</span></span>").join("") +
    "</div>").join("");
  let h = '<table id="matrix"><tr><th class="rowh"></th>' +
    CLASSES.map((c) => '<th title="' + c + " · " + C[c].label + '"><span>' + C[c].ab + "</span></th>").join("") + "</tr>";
  for (let i = 0; i < CLASSES.length; i++) {
    const a = CLASSES[i];
    h += '<tr><th class="rowh" title="' + a + " · " + C[a].label + '">' + C[a].ab + "</th>";
    for (let j = 0; j < CLASSES.length; j++) {
      if (j < i) { h += '<td class="lo"></td>'; continue; }
      h += "<td>" + REL.filter((r) => r.allow(a, CLASSES[j])).map(chip).join("") + "</td>";
    }
    h += "</tr>";
  }
  document.getElementById("matrixwrap").innerHTML = h + "</table>";
}

function buildRelDetail() {
  document.getElementById("rellegend").innerHTML = REL.map((r) =>
    '<span class="lg"><span class="sw" style="background:' + r.col + '"></span><code>' + r.ab +
    "</code> " + r.id + ' <span class="mut">' + r.label + "</span></span>").join("");

  const rows = REL.map((r) =>
    '<tr><td><span class="dot" style="background:' + r.col + '"></span><code>' + r.id + "</code>" +
    '<div class="mut">' + r.label + "</div></td>" +
    "<td>" + r.def + "</td><td>" + r.dir + "</td><td>" + r.gov + "</td><td>" + r.prop + "</td></tr>").join("");

  const cards = REL.map((r) =>
    '<div class="relcard"><div class="relhead"><span class="dot" style="background:' + r.col + '"></span>' +
    '<code class="rid">' + r.id + "</code></div>" +
    "<ul>" + r.when.map((x) => "<li>" + x + "</li>").join("") + "</ul></div>").join("");

  const hcards = REL.map((r) => {
    const hs = hForRel(r.id);
    return '<h2 style="margin-top:22px"><span class="dot" style="background:' + r.col +
      '"></span> ' + r.id + "</h2>" +
      hSection(hs, "No heuristic rule references this relation at present.");
  }).join("");

  document.getElementById("reldetail").innerHTML =
    '<h2 style="margin-top:26px">The seven relations</h2>' +
    '<table class="obs rel"><tr><th>Relation</th><th>Definition</th><th>Direction</th>'+
    '<th>Allowed class pairs</th><th>Relation properties</th></tr>' +
    rows + "</table>" +
    '<h2 style="margin-top:26px">When it holds</h2>' + cards +
    '<h2 style="margin-top:34px">Heuristic rules that reference each relation</h2>' +
    '<p class="intro">The conditions of the rules below reference the existence of the relation or one of its properties.</p>' + hcards;
}

function showTab(k) {
  ["cls", "rel", "heu"].forEach((t) => {
    document.getElementById("v-" + t).classList.toggle("on", t === k);
    document.getElementById("tb-" + t).classList.toggle("on", t === k);
  });
  window.scrollTo(0, 0);
}

buildMatrix();
buildRelDetail();
buildHTable();
show('ThroughHole');
</script>
</body>
</html>
